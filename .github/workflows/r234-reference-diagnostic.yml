name: r234-reference-diagnostic

on:
  push:
    branches:
      - agent/r234-delivery-rehearsal
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reference anchor quality unit tests
        run: node reference-anchor-quality.test.js
      - name: Compare R234 measured candidates with same-KP network reference
        run: node r234-reference-diagnostic.js
      - name: Audit R234 measured reference quality across full route
        run: node r234-reference-quality-audit.js
