name: official-csv-inspect

on:
  push:
    branches:
      - feature/official-route-pilot
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Decode official CSV identity fields
        run: node official-csv-inspect.js
