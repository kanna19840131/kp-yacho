name: official-route-pilot

on:
  push:
    branches:
      - feature/official-route-pilot
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe official road reference point tiles
        run: node official-route-probe.js
      - name: Run Route 5 official-data KML pilot
        run: node official-route-pilot.test.js
      - name: Download National Land Numerical Information road centerline GeoJSON
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://nlftp.mlit.go.jp/ksj/gml/data/N13/N13-24/N13-24_6440_GEOJSON.zip"
          curl -fL --retry 2 "$URL" -o /tmp/n13.zip
          unzip -p /tmp/n13.zip '*/N13-24_6440.geojson' > /tmp/n13.geojson
          ls -lh /tmp/n13.zip /tmp/n13.geojson
      - name: Build Route 5 centerline and measure KP interpolation
        run: node national-road-centerline-pilot.js /tmp/n13.geojson
      - name: Inspect official 100m endpoint parameters
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.road-refpoint.go.jp/kijunten/'
          curl -fsSL --retry 2 "$BASE" -o /tmp/roadref.html
          curl -fsSL --retry 2 "${BASE}roadref.js" -o /tmp/roadref.js
          echo '--- adminpath ---'
          grep -Ein 'adminpath' /tmp/roadref.html /tmp/roadref.js | head -80 || true
          echo '--- pinpoint function 900-1020 ---'
          sed -n '900,1020p' /tmp/roadref.js
          echo '--- range function 1250-1325 ---'
          sed -n '1250,1325p' /tmp/roadref.js
          echo '--- 100m mode switch 1510-1550 ---'
          sed -n '1510,1550p' /tmp/roadref.js
          echo '--- CSV range flow 1660-1815 ---'
          sed -n '1660,1815p' /tmp/roadref.js
          echo '--- select/input identifiers around point/range forms ---'
          grep -Ein 'pinpoint_|name="(rosen|jimusho|chisei|gks|jg|hojo|hm|hm_dist|hm2_a|hm3_a)|id="(rosen|jimusho|chisei|gks|jg|hojo|hm|hm_dist|hm2_a|hm3_a)' /tmp/roadref.html | head -260 || true
