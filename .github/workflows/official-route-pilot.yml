name: official-route-pilot

on:
  push:
    branches:
      - feature/official-route-pilot
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe official road reference point tiles
        run: node official-route-probe.js
      - name: Run Route 5 official-data KML pilot
        run: node official-route-pilot.test.js
      - name: Download National Land Numerical Information road centerline GeoJSON
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://nlftp.mlit.go.jp/ksj/gml/data/N13/N13-24/N13-24_6440_GEOJSON.zip"
          curl -fL --retry 2 "$URL" -o /tmp/n13.zip
          unzip -p /tmp/n13.zip '*/N13-24_6440.geojson' > /tmp/n13.geojson
          ls -lh /tmp/n13.zip /tmp/n13.geojson
      - name: Inspect centerline candidates near Route 5 KP197-203
        run: node national-road-centerline-inspect.js /tmp/n13.geojson
      - name: Build Route 5 centerline and measure KP interpolation
        run: node national-road-centerline-pilot.js /tmp/n13.geojson
      - name: Inspect official road-reference web page for 100m data endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.road-refpoint.go.jp/kijunten/'
          curl -fsSL --retry 2 "$BASE" -o /tmp/roadref.html
          curl -fsSL --retry 2 "${BASE}roadref.js" -o /tmp/roadref.js
          echo '--- scripts/forms ---'
          grep -Eio '<script[^>]+src="[^"]+"|<form[^>]+>|action="[^"]+"' /tmp/roadref.html | head -120 || true
          echo '--- HTML endpoint-like strings near network/CSV/100m ---'
          grep -Ein 'ajax|csv|network|hyaku|100m|100|post|php|xml|json|convert|search|coord' /tmp/roadref.html | head -220 || true
          echo '--- roadref.js endpoint/function strings ---'
          grep -Ein 'ajax|csv|php|xml|json|network|100m|100|Search00|preoutCSV|convert|coord|url|\.php|\.cgi' /tmp/roadref.js | head -400 || true
          echo '--- candidate relative endpoints ---'
          grep -Eo "['\"][A-Za-z0-9_./?-]+\.(php|cgi|json|xml)(\?[^'\"]*)?['\"]" /tmp/roadref.js | sort -u | head -120 || true
