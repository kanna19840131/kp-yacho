name: one-shot-remove-prework

on:
  push:
    branches:
      - fix/no-ghost-prework-record

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-ghost-prework-record
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove unsafe pre-work registration path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_button = '  <button class="btn-green" onclick="startWorkRecord()">施工前登録</button>\n'
          old_help = '  <div class="sub">KP確定後、施工前写真を撮ったら施工前登録。面積は後で編集入力。</div>\n'
          new_help = '  <div class="sub">KP確定後、「このKPで記録」で施工入力へ反映。面積入力後に行追加。</div>\n'

          if old_button not in s:
              raise SystemExit('施工前登録ボタンが見つからないため停止')
          if old_help not in s:
              raise SystemExit('施工前登録の説明文が見つからないため停止')

          s = s.replace(old_button, '', 1)
          s = s.replace(old_help, new_help, 1)

          pattern = r'\nfunction startWorkRecord\(\)\{.*?\n\}\n\nfunction addItem\(\)\{'
          s, n = re.subn(pattern, '\nfunction addItem(){', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'startWorkRecord 削除件数が想定外: {n}')

          s = s.replace('<title>KP野帳 v3.9.1</title>', '<title>KP野帳 v3.9.2</title>', 1)
          s = s.replace('<h1>KP野帳 v3.9.1</h1>', '<h1>KP野帳 v3.9.2</h1>', 1)

          if 'startWorkRecord' in s:
              raise SystemExit('startWorkRecord が残っているため停止')
          if 'onclick="addItem()"' not in s:
              raise SystemExit('行追加ボタンが消えたため停止')
          if 'if(r.area<=0)' not in s:
              raise SystemExit('面積0の登録防止が見つからないため停止')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          start = s.rindex('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/kp-yacho-inline.js').write_text(s[start:end], encoding='utf-8')
          PY
          node --check /tmp/kp-yacho-inline.js
          git diff --check
      - name: Existing regression tests
        run: |
          node route-engine.test.js
          node route-regression.test.js
          node kml-route-loader.test.js
          node calibration-capture-core.test.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: remove accidental pre-work auto-entry path"
          git push origin HEAD:fix/no-ghost-prework-record
