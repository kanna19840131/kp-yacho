name: r234-delivery-rehearsal

on:
  push:
    branches:
      - agent/r234-delivery-rehearsal
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe official Route 234 KP CSV
        run: node r234-probe.js
