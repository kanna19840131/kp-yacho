<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KP野帳 カメラβ</title>
<style>
:root{--bg:#060606;--card:#15171b;--text:#f5f5f5;--muted:#aaa;--blue:#79aaff;--green:#25c05a;--red:#ff5a5f;--gray:#555b63;--line:#343942}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(6,6,6,.94);backdrop-filter:blur(10px);padding:10px 12px;border-bottom:1px solid var(--line)}
header h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);line-height:1.45}
main{padding:12px;max-width:900px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
label{display:block;color:var(--muted);font-size:13px;margin-top:9px}select,input{width:100%;padding:11px;margin-top:5px;border-radius:10px;border:1px solid #555;background:#292c31;color:var(--text);font-size:16px}
button,a.btn{border:0;border-radius:10px;padding:11px 13px;font-size:15px;font-weight:800;color:white;background:#0d6efd;text-decoration:none;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.btn-green{background:var(--green);color:#031407}.btn-red{background:var(--red)}.btn-gray{background:var(--gray)}
.row{display:flex;gap:8px}.row>*{flex:1}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:130px}
.camera-card{position:relative}.camera-shell{position:relative;width:100%;aspect-ratio:3/4;background:#111;overflow:hidden;border-radius:14px;border:1px solid var(--line);touch-action:none}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#overlay{position:absolute;left:3%;bottom:3%;width:46%;max-width:560px;min-width:150px;cursor:move;touch-action:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.82))}
#overlay canvas{display:block;width:100%;height:auto}.capture-bar{display:flex;gap:10px;margin-top:10px}.capture-bar button{flex:1}.shutter{font-size:19px;padding:15px}.status{padding:9px;border-radius:9px;background:#0d0f12;border:1px solid var(--line);margin-top:8px;font-size:13px;color:var(--muted)}
#resultWrap{display:none}#result{width:100%;border-radius:12px;border:1px solid var(--line);background:#111}.range-row{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:end}.warn{background:#3a3008;border:1px solid #7e6a12;color:#ffe28a;padding:9px;border-radius:9px;font-size:13px}
.fullscreen-controls,.rotate-guide,.capture-flash{display:none}body.shooting-mode{overflow:hidden;background:#000}body.shooting-mode header,body.shooting-mode main>.card:not(.camera-card),body.shooting-mode .camera-card>.warn,body.shooting-mode .capture-bar{display:none!important}
body.shooting-mode main{padding:0;max-width:none;width:100vw;height:100dvh;margin:0}body.shooting-mode .camera-card{display:block!important;margin:0;padding:0;border:0;border-radius:0;background:#000;width:100vw;height:100dvh}body.shooting-mode .camera-shell{position:fixed;inset:0;width:100vw;height:100dvh;aspect-ratio:auto;border:0;border-radius:0;z-index:100}
body.shooting-mode .fullscreen-controls{display:flex;position:fixed;z-index:1000;top:0;right:0;bottom:0;width:118px;padding:max(12px,env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) 12px;gap:18px;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(90deg,transparent,rgba(0,0,0,.82));pointer-events:auto;touch-action:manipulation}
body.shooting-mode .fullscreen-controls button{position:relative;z-index:1001;pointer-events:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}body.shooting-mode .fullscreen-controls .full-shutter{width:82px;height:82px;min-width:82px;min-height:82px;flex:0 0 82px;border-radius:50%;padding:0;border:7px solid rgba(255,255,255,.92);background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.45)}body.shooting-mode .fullscreen-controls .full-shutter:active{transform:scale(.9);background:#d9d9d9}
body.shooting-mode .fullscreen-controls .full-close,body.shooting-mode .fullscreen-controls .full-switch{width:94px;min-height:54px;flex:0 0 auto;background:rgba(30,30,30,.82);backdrop-filter:blur(8px)}body.shooting-mode #overlay{max-width:none}body.shooting-mode .capture-flash{display:block;position:fixed;inset:0;z-index:2000;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}body.shooting-mode .capture-flash.on{opacity:.88}
@media(orientation:portrait){body.shooting-mode .rotate-guide{display:flex;position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.82);align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:900;padding:24px;pointer-events:none}body.shooting-mode .fullscreen-controls{opacity:.28}}
@media(max-width:560px){main{padding:8px}.row{display:block}.toolbar>*{min-width:100%}.camera-shell{aspect-ratio:3/4}.range-row{grid-template-columns:1fr 92px}}
</style>
</head>
<body>
<header><h1>KP野帳 カメラβ</h1><div class="sub">施工データを黒板へ反映し、カメラ左下へ重ねて撮影保存</div></header>
<main>
<div class="card"><div class="toolbar"><button onclick="startCamera()">背面カメラ開始</button><button class="btn-green" onclick="enterShootingMode()">全画面撮影</button><button class="btn-gray" onclick="switchCamera()">前後切替</button><button class="btn-gray" onclick="stopCamera()">停止</button></div><div id="cameraStatus" class="status">カメラ未開始</div></div>
<div class="card"><label>施工記録</label><select id="recordSelect" onchange="applyRecord()"><option value="">記録を選択</option></select><div class="row"><div><label>状態</label><select id="state" onchange="drawBoard()"><option>施工前</option><option>施工完了</option><option>空欄</option></select></div><div><label>左下番号</label><input id="smallNo" placeholder="例 35" oninput="drawBoard()"></div></div><div class="range-row"><div><label>黒板サイズ</label><input id="sizeRange" type="range" min="24" max="72" value="46" oninput="resizeOverlay()"></div><button class="btn-gray" onclick="resetOverlay()">位置戻す</button></div><div class="sub">黒板は指で移動できます。サイズはスライダーで調整。</div></div>
<div class="card camera-card"><div id="cameraShell" class="camera-shell"><video id="video" autoplay playsinline muted></video><div id="overlay"><canvas id="board" width="1400" height="1000"></canvas></div></div><div class="capture-bar"><button class="btn-green shutter" onclick="capturePhoto()">撮影して保存</button></div><div class="fullscreen-controls"><button class="full-close" id="fullClose">戻る</button><button class="full-shutter" id="fullShutter" type="button" aria-label="撮影"></button><button class="full-switch" id="fullSwitch">前後切替</button></div><div class="rotate-guide">スマホを横向きにしてください</div><div class="capture-flash" id="captureFlash"></div><div class="warn" style="margin-top:10px">このβ版は正式な改ざん検知付き電子小黒板ではありません。試験運用・社内確認用として使用してください。</div></div>
<div class="card" id="resultWrap"><h2 style="margin:0 0 10px;font-size:18px;color:var(--blue)">撮影結果</h2><img id="result" alt="撮影結果"><div class="toolbar" style="margin-top:9px"><button class="btn-green" onclick="downloadResult()">画像を保存</button><a class="btn btn-gray" href="./blackboard.html">黒板編集へ</a><a class="btn btn-gray" href="./">KP野帳へ</a></div></div>
</main>
<script>
let stream=null,facingMode="environment",resultUrl="",yachoData=null,capturing=false;
const $=id=>document.getElementById(id),v=id=>$(id).value.trim();
const FONT='"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
function formatKP(x){const n=parseFloat(x);return Number.isFinite(n)?n.toFixed(2):String(x||"")}
function displayNo(it){return it?.branch?`${it.no}-${it.branch}`:String(it?.no||"")}
function fitText(ctx,text,maxWidth,start,min=20,weight=700){let s=start;while(s>min){ctx.font=`${weight} ${s}px ${FONT}`;if(ctx.measureText(String(text||"")).width<=maxWidth)break;s-=2}return s}
function roundedRect(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function boardDataFromDraft(){try{return JSON.parse(localStorage.getItem("kp_blackboard_draft_v2")||"{}")}catch(e){return {}}}
function loadRecords(){const raw=localStorage.getItem("kp_yacho_v12"),sel=$("recordSelect");sel.innerHTML='<option value="">記録を選択</option>';if(!raw){drawBoard();return}try{yachoData=JSON.parse(raw);(yachoData.items||[]).forEach((it,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`No.${displayNo(it)} / KP${formatKP(it.kp)} ${it.side||""} / ${Number(it.area||0).toFixed(2)}㎡`;sel.appendChild(o)})}catch(e){yachoData=null}drawBoard()}
function applyRecord(){const i=parseInt(v("recordSelect"),10);if(!yachoData||!Number.isInteger(i)||!yachoData.items?.[i])return;const it=yachoData.items[i];$("smallNo").value=displayNo(it);drawBoard()}
function getCurrentData(){const draft=boardDataFromDraft(),i=parseInt(v("recordSelect"),10),it=(yachoData&&Number.isInteger(i))?yachoData.items?.[i]:null;return{project:draft.project||"一般国道230号 札幌市 川沿地区舗装維持外一連工事",work:draft.work||"パッチング",position:it?(it.kp?`KP${formatKP(it.kp)} ${it.side||""}`:"—"):(draft.position||"—"),design:draft.designMeasure||"—",actual:it?`${it.formula||""}${it.area!==undefined?` = ${Number(it.area||0).toFixed(2)}㎡`:""}`:(draft.actualMeasure||"—"),state:v("state"),smallNo:v("smallNo")||displayNo(it)||draft.smallNo||"",company:draft.company||"道央環境(株)"}}
function drawCentered(ctx,text,x,y,w,h,start,min=22,weight=700){const s=fitText(ctx,text,w-24,start,min,weight);ctx.font=`${weight} ${s}px ${FONT}`;ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(text||""),x+w/2,y+h/2)}
function drawLeft(ctx,text,x,y,w,h,start,min=22,weight=700,pad=18){const s=fitText(ctx,text,w-pad*2,start,min,weight);ctx.font=`${weight} ${s}px ${FONT}`;ctx.fillStyle="#fff";ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(String(text||""),x+pad,y+h/2)}
function drawState(ctx,text,x,y,w,h){if(text==="空欄")return;const lines=text==="施工完了"?["施工","完了"]:[text];let size=112;while(size>48){ctx.font=`800 ${size}px ${FONT}`;if(Math.max(...lines.map(t=>ctx.measureText(t).width))<w-80&&lines.length*size*1.28<h-100)break;size-=4}ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`800 ${size}px ${FONT}`;const gap=size*1.28,start=y+h/2-(lines.length-1)*gap/2+18;lines.forEach((line,i)=>ctx.fillText(line,x+w/2,start+i*gap))}
function drawBoard(){const c=$("board"),ctx=c.getContext("2d"),d=getCurrentData();ctx.clearRect(0,0,c.width,c.height);const metal=ctx.createLinearGradient(0,0,0,c.height);metal.addColorStop(0,"#fafafa");metal.addColorStop(.48,"#d8d8d8");metal.addColorStop(1,"#f4f4f4");ctx.fillStyle=metal;roundedRect(ctx,18,18,1364,964,34);ctx.fill();ctx.strokeStyle="#b8b8b8";ctx.lineWidth=4;ctx.stroke();const bx=46,by=48,bw=1308,bh=904;const green=ctx.createRadialGradient(700,400,80,700,500,850);green.addColorStop(0,"#08734c");green.addColorStop(.58,"#05613f");green.addColorStop(1,"#034a31");ctx.fillStyle=green;roundedRect(ctx,bx,by,bw,bh,18);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=5;roundedRect(ctx,bx+12,by+12,bw-24,bh-24,12);ctx.stroke();const ix=bx+18,iy=by+18,iw=bw-36,ih=bh-36,headerH=124,cy=iy+headerH,ch=ih-headerH,leftW=Math.round(iw*.535),rx=ix+leftW,rw=iw-leftW,labelW=Math.round(leftW*.39),rowH=120;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(ix,cy);ctx.lineTo(ix+iw,cy);ctx.stroke();drawLeft(ctx,"工 事 名",ix,iy,245,headerH,57,36,700,22);drawLeft(ctx,d.project,ix+245,iy,iw-245,headerH,54,27,700,18);ctx.beginPath();ctx.moveTo(rx,cy);ctx.lineTo(rx,iy+ih);ctx.stroke();const labels=["工　種","位　置","設計寸法","実測寸法"],vals=[d.work,d.position,d.design,d.actual];for(let i=0;i<4;i++){const y=cy+i*rowH;ctx.beginPath();ctx.moveTo(ix,y+rowH);ctx.lineTo(rx,y+rowH);ctx.stroke();ctx.beginPath();ctx.moveTo(ix+labelW,y);ctx.lineTo(ix+labelW,y+rowH);ctx.stroke();drawCentered(ctx,labels[i],ix,y,labelW,rowH,51,30,700);drawLeft(ctx,vals[i],ix+labelW,y,leftW-labelW,rowH,53,26,700,18)}drawCentered(ctx,"略　図",rx,cy,rw,94,48,30,700);drawState(ctx,d.state,rx,cy+72,rw,ch-110);ctx.fillStyle="#fff";ctx.textBaseline="alphabetic";ctx.textAlign="left";ctx.font=`600 25px ${FONT}`;ctx.fillText(d.smallNo,ix+14,iy+ih-14);ctx.textAlign="right";const cs=fitText(ctx,d.company,rw-40,46,28,700);ctx.font=`700 ${cs}px ${FONT}`;ctx.fillText(d.company,ix+iw-18,iy+ih-18)}
async function startCamera(){stopCamera();if(!navigator.mediaDevices?.getUserMedia){$("cameraStatus").innerText="このブラウザはカメラAPIに対応していません。";return false}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facingMode},width:{ideal:1920},height:{ideal:1080}},audio:false});$("video").srcObject=stream;await $("video").play();$("cameraStatus").innerText=(facingMode==="environment"?"背面":"前面")+"カメラ起動中";return true}catch(e){$("cameraStatus").innerText="カメラ起動失敗："+e.message;return false}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("video").srcObject=null;$("cameraStatus").innerText="カメラ停止中"}
async function switchCamera(){facingMode=facingMode==="environment"?"user":"environment";await startCamera()}
function resizeOverlay(){$("overlay").style.width=v("sizeRange")+"%"}
function resetOverlay(){$("overlay").style.left="3%";$("overlay").style.top="";$("overlay").style.bottom="3%";$("sizeRange").value="46";resizeOverlay()}
async function enterShootingMode(){if(!stream){const ok=await startCamera();if(!ok)return}document.body.classList.add("shooting-mode");try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){}if(screen.orientation?.lock){try{await screen.orientation.lock("landscape")}catch(e){}}}
async function exitShootingMode(){document.body.classList.remove("shooting-mode");if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}if(screen.orientation?.unlock){try{screen.orientation.unlock()}catch(e){}}}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("shooting-mode")});
(function enableDrag(){const el=$("overlay"),shell=$("cameraShell");let dragging=false,sx=0,sy=0,sl=0,st=0;el.addEventListener("pointerdown",e=>{dragging=true;el.setPointerCapture(e.pointerId);const er=el.getBoundingClientRect(),sr=shell.getBoundingClientRect();sx=e.clientX;sy=e.clientY;sl=er.left-sr.left;st=er.top-sr.top;el.style.bottom="auto";e.preventDefault()});el.addEventListener("pointermove",e=>{if(!dragging)return;const sr=shell.getBoundingClientRect(),er=el.getBoundingClientRect();let l=sl+e.clientX-sx,t=st+e.clientY-sy;l=Math.max(0,Math.min(l,sr.width-er.width));t=Math.max(0,Math.min(t,sr.height-er.height));el.style.left=l+"px";el.style.top=t+"px";e.preventDefault()});el.addEventListener("pointerup",()=>dragging=false);el.addEventListener("pointercancel",()=>dragging=false)})();
function flash(){const f=$("captureFlash");f.classList.add("on");setTimeout(()=>f.classList.remove("on"),110)}
function capturePhoto(){if(capturing)return;const video=$("video");if(!stream||!video.videoWidth){alert("先にカメラを開始してください。");return}capturing=true;flash();drawBoard();try{const out=document.createElement("canvas"),ctx=out.getContext("2d");out.width=video.videoWidth;out.height=video.videoHeight;ctx.drawImage(video,0,0,out.width,out.height);const shell=$("cameraShell").getBoundingClientRect(),ov=$("overlay").getBoundingClientRect(),scaleX=out.width/shell.width,scaleY=out.height/shell.height;ctx.drawImage($("board"),(ov.left-shell.left)*scaleX,(ov.top-shell.top)*scaleY,ov.width*scaleX,ov.height*scaleY);resultUrl=out.toDataURL("image/jpeg",.94);$("result").src=resultUrl;downloadResult();if(!document.body.classList.contains("shooting-mode")){$("resultWrap").style.display="block";$("resultWrap").scrollIntoView({behavior:"smooth"})}}finally{setTimeout(()=>capturing=false,500)}}
function downloadResult(){if(!resultUrl)return;const a=document.createElement("a"),now=new Date();a.href=resultUrl;a.download=`${now.toISOString().replace(/[:.]/g,"-")}_KP野帳カメラ.jpg`;document.body.appendChild(a);a.click();a.remove()}
$("fullShutter").addEventListener("pointerup",e=>{e.preventDefault();e.stopPropagation();capturePhoto()});$("fullClose").addEventListener("pointerup",e=>{e.preventDefault();e.stopPropagation();exitShootingMode()});$("fullSwitch").addEventListener("pointerup",e=>{e.preventDefault();e.stopPropagation();switchCamera()});window.addEventListener("beforeunload",stopCamera);loadRecords();resizeOverlay();drawBoard();
</script>
</body>
</html>
